<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuraNotes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

{% if session.user_id %}

<button class="hamburger" id="hamburger" onclick="toggleSidebar()">
    <span></span>
    <span></span>
    <span></span>
</button>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a href="/" class="sidebar-brand">Neura<span>Notes</span></a>
    </div>
    <nav class="sidebar-nav">
        <a href="/"><span class="nav-icon">🏠</span> Dashboard</a>
        <a href="/subjects"><span class="nav-icon">📚</span> Subjects</a>
        <a href="/goals"><span class="nav-icon">🎯</span> Goals</a>
        <a href="/analytics"><span class="nav-icon">📊</span> Analytics</a>
        <a href="/flashcards"><span class="nav-icon">🃏</span> Flashcards</a>
    </nav>
    <div class="sidebar-footer">
        <a href="/logout"><span>🚪</span> Logout</a>
    </div>
</div>

<div class="main-content" id="mainContent">

{% endif %}

{% block content %}{% endblock %}

{% if session.user_id %}

</div>

<script>
let sidebarOpen = true;

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');

    if (sidebarOpen) {
        sidebar.style.transform = 'translateX(-100%)';
        mainContent.style.marginLeft = '0';
        sidebarOpen = false;
    } else {
        sidebar.style.transform = 'translateX(0)';
        mainContent.style.marginLeft = '260px';
        sidebarOpen = true;
    }
}

if (window.innerWidth <= 768) {
    sidebarOpen = false;
    document.addEventListener('DOMContentLoaded', function() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        if (sidebar) sidebar.style.transform = 'translateX(-100%)';
        if (mainContent) mainContent.style.marginLeft = '0';
    });
}
function toggleMenu(event, menuId) {
    event.preventDefault();
    event.stopPropagation();

    document.querySelectorAll('.dropdown-menu').forEach(m => {
        if (m.id !== menuId) m.classList.remove('show');
    });

    document.getElementById(menuId).classList.toggle('show');
}

document.addEventListener('click', function() {
    document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
});
</script>

{% endif %}
<!-- Custom Confirm Dialog -->
<div id="customConfirm" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
     background:rgba(0,0,0,0.6); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:#3a2d3d; border:1px solid #5C4B57; border-radius:16px;
                padding:30px; max-width:350px; width:90%; text-align:center;
                box-shadow:0 8px 32px rgba(0,0,0,0.5);">
        <div id="confirmEmoji" style="font-size:2.5rem; margin-bottom:15px;">🗑️</div>
        <div id="confirmMessage" style="color:#EBDFE7; font-size:1rem;
             line-height:1.6; margin-bottom:25px;"></div>
        <div style="display:flex; gap:12px; justify-content:center;">
            <button id="confirmOk"
                    style="padding:10px 28px; background:transparent; color:#ff6b8a;
                           border:2px solid #ff6b8a; border-radius:8px; cursor:pointer;
                           font-size:0.95rem; font-weight:600; transition:all 0.2s ease;"
                    onmouseover="this.style.background='rgba(255,107,138,0.15)'"
                    onmouseout="this.style.background='transparent'">
                Delete
            </button>
            <button id="confirmCancel"
                    style="padding:10px 28px; background:transparent; color:#EBDFE7;
                           border:2px solid #5C4B57; border-radius:8px; cursor:pointer;
                           font-size:0.95rem; font-weight:600; transition:all 0.2s ease;"
                    onmouseover="this.style.background='rgba(200,180,196,0.1)'"
                    onmouseout="this.style.background='transparent'">
                Cancel
            </button>
        </div>
    </div>
</div>

<script>
function showConfirm(message, onConfirm) {
    const dialog = document.getElementById('customConfirm');
    document.getElementById('confirmMessage').textContent = message;
    dialog.style.display = 'flex';

    document.getElementById('confirmOk').onclick = function() {
        dialog.style.display = 'none';
        onConfirm();
    };

    document.getElementById('confirmCancel').onclick = function() {
        dialog.style.display = 'none';
    };
}
</script>

</body>
</html>
